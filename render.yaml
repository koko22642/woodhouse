services:
  - type: web
    name: woodhouse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: WOODHOUSE_SYNC_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:you@example.com
      - key: WOODHOUSE_TIMEZONE
        value: America/Chicago
      - key: WOODHOUSE_BRIEFING_TIMES
        value: 07:00,20:00
